---
name: Configurator

on:
  pull_request:
    paths:
      - 'configurator/**'
      - '.github/workflows/configurator.yml'
  push:
    branches:
      - main
    paths:
      - 'configurator/**'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: configurator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: configurator-dist
          path: configurator/dist
          retention-days: 7
...
